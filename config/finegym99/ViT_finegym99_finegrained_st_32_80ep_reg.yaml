# Diving48 Finegrained ST — Point 6: baseline arch + 80 epochs + stronger regularization.
# Goal: push past 91.6% (use best val checkpoint for reporting).
_BASE: ../base.yaml
TASK_TYPE: full_supervised
RANDOM_SEED: 18

TRAIN:
  ENABLE: true
  DATASET: FineGym99
  BATCH_SIZE: 8
  LOG_FILE: train.log
  EVAL_PERIOD: 5
  CHECKPOINT_PERIOD: 5
  CHECKPOINT_FILE_PATH: ""
  CHECKPOINT_TYPE: pytorch
  CHECKPOINT_INFLATE: false
  CHECKPOINT_PRE_PROCESS:
    ENABLE: false
  FINE_TUNE: true
  ONLY_LINEAR: false
  LR_REDUCE: false
  TRAIN_VAL_COMBINE: false
  LOSS_FUNC: cross_entropy
  NUM_CLASS: 99

TEST:
  ENABLE: true
  DATASET: FineGym99
  BATCH_SIZE: 8
  NUM_SPATIAL_CROPS: 1
  SPATIAL_CROPS: cctltr
  NUM_ENSEMBLE_VIEWS: 1
  LOG_FILE: test.log
  CHECKPOINT_FILE_PATH: ""
  CHECKPOINT_TYPE: pytorch
  AUTOMATIC_MULTI_SCALE_TEST: false
  TEST_SET: test
  UPLOAD_CLASSIFIER_RESULTS: true

DATA:
  DATA_ROOT_DIR: /home/xxx/datasets/FineGym288/videos/
  ANNO_DIR: config/finegym99/full_supervised
  TRAIN_SPLIT: gym99_train.txt
  TEST_SPLIT: gym99_test.txt
  NUM_INPUT_FRAMES: 32
  SAMPLING_RATE: 4
  SAMPLING_MODE: segment_based
  SAMPLING_UNIFORM: false
  USE_SHORT_SIDE_RESIZE: true
  TRAIN_SHORT_SIDE: 256
  TRAIN_JITTER_SCALES: [256, 256]
  MEAN: [0.48145466, 0.4578275, 0.40821073]
  STD: [0.26862954, 0.26130258, 0.27577711]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 224
  TEST_SCALE: 256
  TEST_CENTER_CROP: true
  CLIP_INTERVAL: 8
  FPS: 12
  TARGET_FPS: 12

LOG_PERIOD: 100

SOLVER:
  BASE_LR: 0.0025
  LR_POLICY: cosine
  STEPS_ITER: 1200
  STEPS: [0, 4, 6, 8, 12, 16, 20, 25, 30]
  LRS: [1, 0.1, 0.05, 0.01, 0.005, 0.002, 0.001, 0.0005, 0.0002]
  MAX_EPOCH: 50
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.05
  WARMUP_EPOCHS: 3
  WARMUP_START_LR: 0.0005
  OPTIM_METHOD: adamw
  DAMPENING: 0.0
  NESTEROV: true

OPTIMIZER:
  BASE_LR: 0.0025
  WEIGHT_DECAY: 0.05
  OPTIM_METHOD: adamw
  MOMENTUM: 0.9
  DAMPENING: 0.0
  NESTEROV: true
  MAX_EPOCH: 50

ADAPTER:
  NAME: ViT_CLIP
  PRETRAINED: ViT-B/16
  WIDTH: 768
  PATCH_SIZE: 16
  LAYERS: 12
  HEADS: 12
  ADAPTER_SCALE: 0.25
  TYPE: finegrained_causal_anticausal
  APPLY_LAST_N: 10
  ACT: gelu
  USE_LN: false
  USE_BN: false
  TEMPORAL_K: 5
  USE_CROSS_PATCH: false
  USE_ASYMMETRIC_TEMPORAL: true
  USE_MULTISCALE_SPATIAL: true
  N_PHASES: 4

VIDEO:
  HEAD:
    NAME: BaseHead
    ACTIVATION: softmax
    DROPOUT_RATE: 0.25
    NUM_CLASSES: null

DATA_LOADER:
  NUM_WORKERS: 16
  PIN_MEMORY: true
  ENABLE_MULTI_THREAD_DECODE: true

AUGMENTATION:
  COLOR_AUG: true
  BRIGHTNESS: 0.3
  CONTRAST: 0.3
  SATURATION: 0.3
  HUE: 0.1
  GRAYSCALE: 0.2
  CONSISTENT: true
  SHUFFLE: true
  GRAY_FIRST: true
  IS_SPLIT: false
  RATIO: [0.857142857142857, 1.1666666666666667]
  USE_GPU: false
  RANDOM_ERASING:
    ENABLE: true
    PROB: 0.5
    MODE: const
    COUNT: [1, 1]
    NUM_SPLITS: 0
    AREA_RANGE: [0.02, 0.33]
    MIN_ASPECT: 0.3
  MIXUP:
    ENABLE: false
    ALPHA: 0.4
    PROB: 0.5
    MODE: batch
    SWITCH_PROB: 0.4
  CUTMIX:
    ENABLE: false
    ALPHA: 1.0
    MINMAX: null

  LABEL_SMOOTHING: 0.05
  SSV2_FLIP: false

INIT_METHOD: tcp://localhost:1450
NUM_GPUS: 4
CUDA_VISIBLE_DEVICES: 0, 1, 2, 3
OUTPUT_DIR: output/finegym99_finegrained_st_causal_anticausal_32_80ep_reg